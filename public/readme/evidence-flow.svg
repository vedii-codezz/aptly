<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc"><title id="title">APTLY evidence reasoning flow</title><desc id="desc">An illustrative chain from source wording to a matched decision.</desc><rect width="1600" height="440" fill="#F3F5F7"/><g font-family="Arial,Helvetica,sans-serif"><g fill="#111318"><text x="80" y="95" font-size="22" letter-spacing="3">01</text><text x="80" y="145" font-size="27" font-weight="700">SOURCE</text><text x="80" y="205" font-size="24">“Minimum CGPA of 8.0”</text><text x="450" y="95" font-size="22" letter-spacing="3">02</text><text x="450" y="145" font-size="27" font-weight="700">NORMALIZED RULE</text><text x="450" y="205" font-size="24">CGPA ≥ 8.0</text><text x="855" y="95" font-size="22" letter-spacing="3">03</text><text x="855" y="145" font-size="27" font-weight="700">PROFILE EVIDENCE</text><text x="855" y="205" font-size="24">CGPA 9.16</text><text x="1250" y="95" font-size="22" letter-spacing="3">04</text><text x="1250" y="145" font-size="27" font-weight="700">DECISION</text><text x="1250" y="205" font-size="28" font-weight="700">MATCHED</text></g><path d="M320 170H410M735 170H815M1170 170H1210" stroke="#2457FF" stroke-width="6"/><path d="M150 290H1450" stroke="#D8DCE3"/><text x="80" y="350" fill="#626874" font-size="18" letter-spacing="2">ILLUSTRATIVE DOCUMENTATION EXAMPLE · SOURCE → RULE → EVIDENCE → DETERMINISTIC DECISION</text></g></svg>
