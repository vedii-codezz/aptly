<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="t d"><title id="t">Usual AI matching compared to APTLY</title><desc id="d">A comparison of mystery scores and inspectable reasoning.</desc><rect width="1600" height="500" fill="#0B1220"/><g font-family="Arial,Helvetica,sans-serif"><rect x="55" y="55" width="700" height="390" fill="#111318" stroke="#C63C45"/><rect x="845" y="55" width="700" height="390" fill="#F3F5F7" stroke="#2457FF"/><g font-size="28" font-weight="700"><text x="100" y="115" fill="white">THE USUAL WAY</text><text x="890" y="115" fill="#111318">APTLY/</text></g><g font-size="25"><text x="100" y="180" fill="#C63C45">✕ 82% MATCH</text><text x="100" y="230" fill="#D8DCE3">Mystery score</text><text x="100" y="280" fill="#D8DCE3">Missing = failed</text><text x="100" y="330" fill="#D8DCE3">AI decides</text><text x="100" y="380" fill="#D8DCE3">“Add keywords”</text><text x="890" y="180" fill="#16835D">✓ MATCHED — HERE'S THE EVIDENCE.</text><text x="890" y="230" fill="#111318">Inspectable reasoning</text><text x="890" y="280" fill="#111318">Missing = UNKNOWN</text><text x="890" y="330" fill="#111318">Rules decide</text><text x="890" y="380" fill="#111318">Shows missing evidence</text></g><text x="800" y="482" text-anchor="middle" fill="#D8DCE3" font-size="16" letter-spacing="2">ONE OF THESE IS CONSIDERABLY HARDER TO FAKE.</text></g></svg>
