<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="t d"><title id="t">Gemini interpretation and deterministic decision boundary</title><desc id="d">Gemini interprets language; deterministic logic decides eligibility.</desc><rect width="1600" height="620" fill="#0B1220"/><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="800" y="75" fill="white" font-size="42" font-weight="700">WAIT. WHY ISN'T GEMINI DECIDING ELIGIBILITY?</text><g font-size="28"><text x="800" y="160" fill="#D8DCE3">GEMINI — “Here's what I think this requirement means.”</text><text x="800" y="255" fill="#D8DCE3">ZOD — structure police</text><text x="800" y="350" fill="#D8DCE3">NORMALIZATION — make it comparable</text></g><path d="M800 180v45m0 50v45m0 50v45" stroke="#2457FF" stroke-width="6"/><rect x="430" y="430" width="740" height="105" fill="none" stroke="#E9EDF3" stroke-width="4"/><text x="800" y="482" fill="white" font-size="32" font-weight="700">DETERMINISTIC ENGINE</text><text x="800" y="517" fill="#D8DCE3" font-size="22">“Cool. I'll make the actual decision.”</text><text x="1300" y="570" fill="#2457FF" font-size="18">ROLES, NOT VIBES.</text></g></svg>
